<svg viewBox="0 0 1200 260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#141414"/>
    </linearGradient>
    <linearGradient id="bar1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F5A623"/>
      <stop offset="100%" stop-color="#8a5c14"/>
    </linearGradient>
    <linearGradient id="barSide" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a86a15"/>
      <stop offset="100%" stop-color="#6b430e"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="1200" height="260" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="1199" height="259" fill="none" stroke="#1f1f1f" stroke-width="1"/>

  <text x="60" y="70" font-family="JetBrains Mono, monospace" font-size="30" fill="#f2f2f2" font-weight="600">GrindLens</text>
  <text x="60" y="98" font-family="JetBrains Mono, monospace" font-size="14" fill="#7a7a7a">leetcode analytics that don't lie to you</text>

  <!-- isometric bar chart, extruded blocks for depth -->
  <g filter="url(#soft)">
    <!-- bar 1 -->
    <g transform="translate(760,0)">
      <polygon points="0,190 40,170 40,110 0,130" fill="url(#bar1)"/>
      <polygon points="40,170 70,190 70,130 40,110" fill="url(#barSide)"/>
      <polygon points="0,130 40,110 70,130 40,150" fill="#ffcf7a"/>
    </g>
    <!-- bar 2 -->
    <g transform="translate(830,0)">
      <polygon points="0,190 40,170 40,80 0,100" fill="url(#bar1)"/>
      <polygon points="40,170 70,190 70,100 40,80" fill="url(#barSide)"/>
      <polygon points="0,100 40,80 70,100 40,120" fill="#ffcf7a"/>
    </g>
    <!-- bar 3, tallest -->
    <g transform="translate(900,0)">
      <polygon points="0,190 40,170 40,50 0,70" fill="url(#bar1)"/>
      <polygon points="40,170 70,190 70,70 40,50" fill="url(#barSide)"/>
      <polygon points="0,70 40,50 70,70 40,90" fill="#ffcf7a"/>
    </g>
    <!-- bar 4 -->
    <g transform="translate(970,0)">
      <polygon points="0,190 40,170 40,95 0,115" fill="url(#bar1)"/>
      <polygon points="40,170 70,190 70,115 40,95" fill="url(#barSide)"/>
      <polygon points="0,115 40,95 70,115 40,135" fill="#ffcf7a"/>
    </g>
    <!-- bar 5, small -->
    <g transform="translate(1040,0)">
      <polygon points="0,190 40,170 40,140 0,160" fill="url(#bar1)"/>
      <polygon points="40,170 70,190 70,160 40,140" fill="url(#barSide)"/>
      <polygon points="0,160 40,140 70,160 40,180" fill="#ffcf7a"/>
    </g>
  </g>

  <line x1="60" y1="200" x2="1140" y2="200" stroke="#2a2a2a" stroke-width="1"/>
  <text x="60" y="225" font-family="JetBrains Mono, monospace" font-size="12" fill="#5a5a5a">streaks that don't reset on a missed login</text>
  <text x="60" y="245" font-family="JetBrains Mono, monospace" font-size="12" fill="#5a5a5a">grindlens.dev</text>
</svg>
